
services:
  mongo_db:
    container_name: db_container
    image: mongo:latest
    ports:
      - "27017:27017"
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    image: nodeapp
    ports:
      - "3030:3030"
    environment:
      MONGODB_URI: mongodb://mongo_db:27017/dealershipsDB
    depends_on:
      mongo_db:
        condition: service_healthy

  sentiment:
    build:
      context: ../djangoapp/microservices
    ports:
      - "5050:5050"
    environment:
      FLASK_APP: app.py
      FLASK_RUN_HOST: 0.0.0.0
      FLASK_RUN_PORT: 5050

volumes:
  mongo_data:
