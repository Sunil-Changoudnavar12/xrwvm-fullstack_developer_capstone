name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install Django dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Check Django and migrations
        working-directory: server
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/frontend/package-lock.json
       -  name: Build React application
          working-directory: server/frontend
          run: npm run build
          env:
            CI: false
      - name: Validate Node API syntax
        working-directory: server/database
        run: node --check app.js
